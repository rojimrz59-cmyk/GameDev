<title>Pigeon Express</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pigeon Express">
<meta name="theme-color" content="#7FD0FF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: cartoon sticker look. Sky header (sun, clouds, growing skyline) / scrolling cards / thumb tab bar. */
:root {
  --sky-top: #7FD0FF; --sky-bot: #DDF4FF; --tint: rgba(0,0,0,0);
  --line: #2A1B3D; --ink: #2A1B3D; --ink-soft: #6A5A86;
  --card: #FFFDF7; --card-2: #FFF1D6; --lane: #E4F3FF; --lane-dash: #A9C9E6; --ground: rgba(42,27,61,.16);
  --coral: #FF5A4E; --coral-deep: #D63A30; --on-coral: #FFFFFF;
  --sun: #FFC93C; --sun-deep: #E89B00; --on-sun: #4A2A00;
  --mint: #2DD4A7; --mint-deep: #16A383; --on-mint: #10372C;
  --grape: #8B5CF6; --pink: #FF8FB1; --off: #D9D2E6; --on-off: #7D7196;
  --overlay: rgba(25,14,40,.55);
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", -apple-system, "Segoe UI", system-ui, sans-serif;
  --pg-body: #A7B3C9; --pg-wing: #7F8BA6; --pg-belly: #E3E9F4;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sky-top: #141B47; --sky-bot: #2A3577; --ink: #FFF7EA; --ink-soft: #C9BEE6; --card: #2E2A5C; --card-2: #3A3570;
  --lane: #3B3F80; --lane-dash: #6B70B8; --ground: rgba(0,0,0,.35); --off: #4A4578; --on-off: #A79FCB;
  --overlay: rgba(5,3,15,.7); color-scheme: dark; } }
:root[data-theme="dark"] {
  --sky-top: #141B47; --sky-bot: #2A3577; --ink: #FFF7EA; --ink-soft: #C9BEE6; --card: #2E2A5C; --card-2: #3A3570;
  --lane: #3B3F80; --lane-dash: #6B70B8; --ground: rgba(0,0,0,.35); --off: #4A4578; --on-off: #A79FCB;
  --overlay: rgba(5,3,15,.7); color-scheme: dark; }

html, body { height: 100%; overscroll-behavior: none; }
body { margin: 0; background: linear-gradient(var(--tint), var(--tint)), radial-gradient(circle at 12% 88%, rgba(255,143,177,.28), transparent 38%), radial-gradient(circle at 88% 72%, rgba(45,212,167,.24), transparent 38%), radial-gradient(circle at 50% 104%, rgba(255,201,60,.3), transparent 45%), linear-gradient(180deg, var(--sky-top), var(--sky-bot) 50%); background-color: var(--sky-bot);
  color: var(--ink); font-family: var(--font-body); font-weight: 800; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
button, select, input { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--grape); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.disp { font-family: var(--font-display); font-weight: 400; letter-spacing: .01em; }
#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; position: relative; overflow: hidden; }

/* HUD */
.hud { position: relative; padding: 10px max(14px, env(safe-area-inset-left, 0px)) 0 max(14px, env(safe-area-inset-right, 0px)); z-index: 2; }
.sky { position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.sun { position: absolute; left: -34px; top: 54px; width: 96px; height: 96px; opacity: .95; }
.sun svg { width: 100%; height: 100%; animation: spin 40s linear infinite; }
.cloud { position: absolute; width: 96px; height: 34px; animation: drift 70s linear infinite; }
.skyline { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; }
.skyline svg { width: 100%; height: 100%; display: block; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes drift { from { transform: translateX(-130px); } to { transform: translateX(640px); } }
.hud-row { display: flex; align-items: center; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; background: var(--card); border: 3px solid var(--line); border-radius: 999px; padding: 2px 9px 2px 3px; box-shadow: 0 3px 0 var(--line); font-size: 14px; min-height: 34px; position: relative; }
.chip svg { width: 24px; height: 24px; flex: none; }
.chip .badge-n { position: absolute; top: -8px; right: -6px; background: var(--coral); color: #fff; border: 2px solid var(--line); border-radius: 999px; font-size: 11px; min-width: 20px; height: 20px; display: grid; place-items: center; padding: 0 4px; }
.chip.bounce { animation: wiggle 1.2s ease-in-out infinite; }
@keyframes wiggle { 0%, 60%, 100% { transform: rotate(0); } 70% { transform: rotate(-10deg) scale(1.08); } 80% { transform: rotate(9deg) scale(1.08); } 90% { transform: rotate(-5deg); } }
.city { flex: 1; text-align: center; font-family: var(--font-display); font-size: 17px; color: var(--ink); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 0 var(--card); }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--card); border: 3px solid var(--line); box-shadow: 0 3px 0 var(--line); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }
.wallet { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; }
.wallet svg { width: 38px; height: 38px; filter: drop-shadow(0 3px 0 var(--line)); }
.wallet .amount { font-family: var(--font-display); font-size: clamp(36px, 11vw, 46px); line-height: 1; color: #fff; -webkit-text-stroke: 2px var(--line); paint-order: stroke fill; text-shadow: 0 4px 0 var(--line); }
.wallet.bump .amount { animation: bump .3s ease-out; }
@keyframes bump { 40% { transform: scale(1.12); } }
.rate { display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; margin: 6px 0 70px; font-size: 14px; }
.rate .pill { background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 1px 10px; }
.pill.boost { background: var(--sun); color: var(--on-sun); }
.pill.gold { background: var(--coral); color: #fff; }
.pill.combo { background: var(--grape); color: #fff; }

/* Main */
main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 8px max(14px, env(safe-area-inset-left, 0px)) 22px max(14px, env(safe-area-inset-right, 0px)); margin-top: -62px; position: relative; z-index: 3; }
.tab { display: flex; flex-direction: column; gap: 14px; }
.tab.in-r { animation: inR .28s cubic-bezier(.2,.9,.3,1.2); }
.tab.in-l { animation: inL .28s cubic-bezier(.2,.9,.3,1.2); }
@keyframes inR { from { transform: translateX(40px); opacity: 0; } }
@keyframes inL { from { transform: translateX(-40px); opacity: 0; } }
.multi { display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
.multi span { margin-right: auto; font-family: var(--font-display); font-size: 16px; }
.multi button { padding: 4px 10px; border-radius: 999px; background: var(--card); border: 3px solid var(--line); font-size: 13px; min-width: 48px; min-height: 34px; box-shadow: 0 3px 0 var(--line); }
.multi button[aria-pressed="true"] { background: var(--ink); color: var(--card); }

/* Cards & buttons */
.card { background: var(--card); border: 3px solid var(--line); border-radius: 24px; box-shadow: 0 5px 0 var(--line); padding: 12px; }
.btn { border: 3px solid var(--line); border-radius: 18px; padding: 6px 12px; min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; box-shadow: 0 4px 0 var(--line); transition: transform .08s, box-shadow .08s; position: relative; overflow: hidden; font-size: 15px; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn small { font-size: 12px; display: flex; align-items: center; gap: 3px; }
.btn small svg { width: 15px; height: 15px; }
.btn-buy { background: var(--coral); color: var(--on-coral); }
.btn-mgr { background: var(--mint); color: var(--on-mint); }
.btn-sun { background: var(--sun); color: var(--on-sun); }
.btn-grape { background: var(--grape); color: #fff; }
.btn-ghost { background: var(--card-2); color: var(--ink); }
.btn:disabled { background: var(--off); color: var(--on-off); box-shadow: 0 2px 0 var(--line); cursor: default; }
.btn.ready { animation: readyPulse 1.5s ease-in-out infinite; }
@keyframes readyPulse { 50% { scale: 1.035; } }
.btn.ready::after { content: ""; position: absolute; top: -10%; bottom: -10%; width: 30%; left: -40%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); animation: shine 2.6s ease-in-out infinite; }
@keyframes shine { 0%, 55% { left: -40%; } 85%, 100% { left: 120%; } }

/* Route card */
.route { display: grid; grid-template-columns: 76px 1fr; gap: 6px 10px; position: relative; }
.route .art { grid-row: span 2; width: 76px; height: 76px; position: relative; cursor: pointer; }
.route .art svg.loft { width: 76px; height: 76px; display: block; animation: breathe 3.2s ease-in-out infinite; transform-origin: 50% 90%; }
.route .art.pop svg.loft { animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
@keyframes breathe { 50% { transform: scale(1.02, .985); } }
.loft .flagw { transform-box: fill-box; transform-origin: 0% 50%; animation: wave 1.1s ease-in-out infinite alternate; }
@keyframes wave { to { transform: skewY(-14deg) scaleX(.88); } }
@keyframes pop { 0% { transform: scale(1.3, .7); } 60% { transform: scale(.92, 1.1); } 100% { transform: scale(1); } }
.crew-btn { position: absolute; right: -8px; bottom: -6px; width: 34px; height: 34px; border-radius: 50%; background: var(--card-2); border: 3px solid var(--line); display: grid; place-items: center; overflow: hidden; }
.crew-btn svg { width: 40px; height: 34px; margin-left: -8px; margin-top: 4px; }
.crew-btn.empty { font-family: var(--font-display); font-size: 20px; color: var(--ink-soft); }
.route .head { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.route .name { font-family: var(--font-display); font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.route .lvl { color: var(--ink-soft); font-size: 13px; white-space: nowrap; }
.lane { position: relative; height: 46px; border-radius: 16px; background: var(--lane); border: 3px solid var(--line); cursor: pointer; }
.lane::before { content: ""; position: absolute; left: 14px; right: 40px; top: 50%; border-top: 3px dashed var(--lane-dash); }
.lane .pigeon { position: absolute; top: 0; left: 0; width: 50px; height: 44px; transform: translate(var(--x, 0px), var(--y, 0px)); will-change: transform; }
.route { background: color-mix(in srgb, var(--rc, #fff) 14%, var(--card)); }
.route .lane { background: color-mix(in srgb, var(--rc, #fff) 24%, var(--lane)); }
.route .name { text-shadow: 0 3px 0 color-mix(in srgb, var(--rc, #000) 60%, transparent); }
.route .bar i { background: linear-gradient(90deg, var(--sun), color-mix(in srgb, var(--rc, #FFC93C) 80%, var(--sun))); }
.lane.boosted { box-shadow: 0 0 0 3px var(--sun), 0 0 14px var(--sun); }
.lane.boosted::before { border-top: 0; height: 6px; top: calc(50% - 3px); border-radius: 3px; background: repeating-linear-gradient(90deg, #FF5A4E 0 10px, #FFC93C 10px 20px, #2DD4A7 20px 30px, #4D8DFF 30px 40px, #A27BFF 40px 50px); background-size: 50px 6px; animation: rainbow .45s linear infinite; }
@keyframes rainbow { to { background-position: 50px 0; } }
.lane .dest { position: absolute; right: 4px; top: 5px; width: 32px; height: 32px; }
.lane .dest .flag { transform-box: fill-box; transform-origin: 0% 100%; transition: transform .2s; }
.lane.delivered .dest .flag { transform: rotate(-70deg); }
.lane.window .dest { animation: glow .35s ease-in-out infinite alternate; }
@keyframes glow { to { transform: scale(1.18); filter: drop-shadow(0 0 6px var(--sun)); } }
.lane .hint { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; pointer-events: none; padding-left: 46px; padding-right: 40px; text-align: center; }
.lane .hint b { color: var(--coral); }
.stamp { position: absolute; right: 26px; top: -14px; font-family: var(--font-display); font-size: 16px; color: var(--coral); border: 3px solid var(--coral); border-radius: 8px; padding: 0 6px; background: var(--card); transform: rotate(-12deg); pointer-events: none; animation: stampIn .7s cubic-bezier(.2,1.8,.4,1) forwards; white-space: nowrap; z-index: 4; }
.stamp.miss { color: var(--ink-soft); border-color: var(--ink-soft); }
@keyframes stampIn { 0% { transform: rotate(-12deg) scale(2.4); opacity: 0; } 30% { transform: rotate(-12deg) scale(1); opacity: 1; } 80% { opacity: 1; } 100% { transform: rotate(-12deg) translateY(-10px); opacity: 0; } }
.zzz { position: absolute; left: 34px; top: -12px; font-family: var(--font-display); font-size: 16px; color: var(--grape); animation: zzz 1.4s ease-in-out infinite; pointer-events: none; }
@keyframes zzz { 0% { transform: translateY(4px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translate(8px, -8px); opacity: 0; } }
.cat { position: absolute; left: 50%; top: -10px; width: 74px; height: 54px; margin-left: -37px; animation: catIn .5s cubic-bezier(.2,1.5,.4,1); z-index: 3; }
.cat.tickle { animation: tickle .25s; }
.cat-n { position: absolute; right: -4px; top: -6px; min-width: 22px; height: 22px; border-radius: 999px; background: var(--coral); color: #fff; border: 2px solid var(--line); font-family: var(--font-display); font-size: 13px; display: grid; place-items: center; }
.cat.leave { animation: catOut .6s ease-in forwards; }
.cat .tail { transform-box: fill-box; transform-origin: 0% 100%; animation: swish 1.2s ease-in-out infinite alternate; }
@keyframes catIn { from { transform: translateY(-40px) scale(.4); opacity: 0; } }
@keyframes tickle { 25% { transform: rotate(-8deg) scale(1.08); } 75% { transform: rotate(8deg) scale(1.08); } }
@keyframes catOut { to { transform: translateX(260px) rotate(20deg); opacity: 0; } }
@keyframes swish { to { transform: rotate(-25deg); } }
.coin-pop { position: absolute; right: 34px; top: -6px; font-family: var(--font-display); font-size: 15px; color: var(--sun); -webkit-text-stroke: 1px var(--line); paint-order: stroke fill; pointer-events: none; animation: rise .8s ease-out forwards; white-space: nowrap; z-index: 4; }
.coin-pop.big { font-size: 22px; color: var(--coral); }
@keyframes rise { from { transform: translateY(6px) scale(.8); opacity: 1; } to { transform: translateY(-20px) scale(1.1); opacity: 0; } }
.route .ms { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 12px; }
.route .ms-t { white-space: nowrap; color: var(--ink-soft); }
.route .gain { white-space: nowrap; }
.bar { flex: 1; height: 12px; border-radius: 999px; background: var(--lane); border: 2px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; transform-origin: left; transform: scaleX(var(--f, 0)); background: var(--sun); transition: transform .3s; }
.route .actions { grid-column: 1 / -1; display: flex; gap: 8px; }
.route .actions .btn-buy { flex: 1.6; }
.route .actions .btn-mgr { flex: 1; font-size: 13px; }
.mgr-badge { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; border: 3px dashed var(--mint-deep); color: var(--mint-deep); border-radius: 18px; }
:root[data-theme="dark"] .mgr-badge { color: var(--mint); border-color: var(--mint); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mgr-badge { color: var(--mint); border-color: var(--mint); } }
.mgr-badge svg { width: 22px; height: 22px; }
.route.locked .art svg.loft, .route.locked .lane { filter: grayscale(1) opacity(.55); }
.route.locked .lane { cursor: default; }

.pigeon .wing { transform-box: view-box; transform-origin: 30px 28px; }
.pigeon.flying .wing { animation: flap .2s ease-in-out infinite alternate; }
.pigeon.flying .body-g { animation: bob .4s ease-in-out infinite alternate; }
.pigeon .prop { transform-box: fill-box; transform-origin: center; animation: spinX .3s linear infinite; }
@keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(-.5); } }
@keyframes bob { from { transform: translateY(-1.5px); } to { transform: translateY(1.5px); } }
@keyframes spinX { 50% { transform: scaleX(.15); } }

/* Panels & lists */
.panel { display: flex; flex-direction: column; gap: 10px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; text-wrap: balance; }
.panel p { margin: 0; color: var(--ink-soft); font-size: 14px; line-height: 1.4; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.title { font-size: 15px; }
.sub { font-size: 13px; color: var(--ink-soft); }
.row .btn { min-width: 100px; min-height: 46px; font-size: 14px; }
.list { display: flex; flex-direction: column; gap: 12px; }
.list > .row + .row { border-top: 2px dashed var(--lane-dash); padding-top: 12px; }
.ico { width: 44px; height: 44px; border-radius: 14px; background: var(--card-2); border: 3px solid var(--line); display: grid; place-items: center; flex: none; }
.ico svg { width: 28px; height: 28px; }
.done { color: var(--mint-deep); font-size: 13px; display: flex; align-items: center; gap: 4px; }
.streak { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.streak div { border-radius: 12px; background: var(--card-2); border: 2px solid var(--line); text-align: center; padding: 5px 1px; font-size: 11px; color: var(--ink-soft); position: relative; }
.streak div b { display: block; font-size: 14px; color: var(--ink); }
.streak div.got { background: var(--mint); color: var(--on-mint); }
.streak div.today { background: var(--sun); animation: wiggle 1.6s infinite; }
.streak .egg-mark { position: absolute; top: -9px; right: -4px; width: 16px; height: 20px; }
.big-stat { font-family: var(--font-display); font-size: 34px; }
.note { font-size: 12px; color: var(--ink-soft); }
.skins, .album { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.tile { border-radius: 18px; background: var(--card-2); border: 3px solid var(--line); padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.tile svg.pigeon { width: 82px; height: 70px; }
.tile.on { background: color-mix(in srgb, var(--mint) 35%, var(--card)); }
.tile .btn { width: 100%; min-height: 40px; font-size: 13px; }
.tile.unknown svg.pigeon { filter: brightness(0) opacity(.25); }
.stars { color: var(--sun); -webkit-text-stroke: 1px var(--line); letter-spacing: 2px; font-size: 16px; }
.rarity { font-size: 11px; border-radius: 999px; padding: 1px 8px; border: 2px solid var(--line); }
.rarity.common { background: var(--card); } .rarity.rare { background: var(--pink); color: var(--line); } .rarity.legendary { background: var(--sun); color: var(--line); }
.incubator { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.slot { border-radius: 18px; background: var(--card-2); border: 3px solid var(--line); padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-height: 190px; justify-content: center; }
.slot svg.egg { width: 56px; height: 70px; animation: eggWobble 2.2s ease-in-out infinite; transform-origin: 50% 90%; }
.slot.ready svg.egg { animation: eggWobble .5s ease-in-out infinite; }
@keyframes eggWobble { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-9deg); } 86% { transform: rotate(8deg); } 94% { transform: rotate(-4deg); } }
.slot .btn { width: 100%; min-height: 40px; font-size: 13px; }
.eggs-row { display: flex; gap: 8px; flex-wrap: wrap; }
.eggs-row svg { width: 34px; height: 42px; }

/* Tab bar */
.tabbar { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--card); border-top: 3px solid var(--line); padding: 4px max(6px, env(safe-area-inset-left, 0px)) 4px max(6px, env(safe-area-inset-right, 0px)); position: relative; z-index: 5; }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 0 3px; font-size: 11px; color: var(--ink-soft); position: relative; min-height: 54px; transition: transform .15s; }
.tabbar button svg { width: 28px; height: 28px; }
.tabbar button[aria-selected="true"] { color: var(--coral); transform: translateY(-3px); }
.tabbar button[aria-selected="true"] svg { animation: hop .35s cubic-bezier(.2,1.8,.4,1); }
@keyframes hop { 40% { transform: translateY(-6px) scale(1.15); } }
.dot { position: absolute; top: 3px; right: calc(50% - 20px); width: 13px; height: 13px; border-radius: 50%; background: var(--coral); border: 2px solid var(--line); }

/* Golden pigeon, toasts, modal, coach, fx */
#golden { position: absolute; left: 0; width: 92px; height: 80px; z-index: 30; animation: cross var(--dur, 9s) linear forwards; filter: drop-shadow(0 0 12px #FFD54A); padding: 4px; }
#golden svg { width: 84px; height: 72px; --pg-body: #FFD54A; --pg-wing: #F2A900; --pg-belly: #FFF2B8; }
@keyframes cross { from { transform: translateX(-100px); } 25% { transform: translateX(22vw) translateY(-14px); } 50% { transform: translateX(45vw) translateY(10px); } 75% { transform: translateX(68vw) translateY(-12px); } to { transform: translateX(calc(min(100vw, 560px) + 10px)); } }
#toasts { position: absolute; left: 0; right: 0; bottom: 74px; display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 40; pointer-events: none; padding: 0 14px; }
