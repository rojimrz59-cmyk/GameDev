<title>Pigeon Express</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pigeon Express">
<meta name="theme-color" content="#9FD6FF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one-screen portrait app. Sky header (wallet) / scrolling list of lofts / thumb tab bar. */
:root {
  --sky-top: #9FD6FF; --sky-bot: #EAF6FF; --tint: rgba(0,0,0,0);
  --ink: #14213D; --ink-soft: #4B5A78; --card: #FFFFFF; --card-line: #D3E3F3; --lane: #E1EEFB;
  --ground: rgba(20,33,61,.12);
  --coral: #F2503F; --coral-deep: #C93727; --on-coral: #FFFFFF;
  --sun: #FFC23D; --sun-deep: #E09A00; --on-sun: #4A3000;
  --mint: #0F9F84; --on-mint: #FFFFFF; --lilac: #6D4DF2;
  --disabled: #D2DEEA; --on-disabled: #6F7E98;
  --shadow: 0 6px 16px rgba(20,33,61,.10);
  --overlay: rgba(10,18,40,.45);
  --font-display: "Fredoka", "Trebuchet MS", "Avenir Next", system-ui, sans-serif;
  --font-body: "Nunito", -apple-system, "Segoe UI", system-ui, sans-serif;
  --pg-body: #9AA5B8; --pg-wing: #7C879C; --pg-neck: #5FB3A1;
  --acc-cap: 0; --acc-gog: 0; --acc-crown: 0; --acc-scarf: 0;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sky-top: #0D1736; --sky-bot: #16244C; --ink: #EEF3FF; --ink-soft: #A7B4D4; --card: #1C2A55;
  --card-line: #2B3C70; --lane: #23346A; --ground: rgba(0,0,0,.35); --coral: #FF6B5A; --coral-deep: #D94C3C;
  --disabled: #2C3B68; --on-disabled: #8391B8; --shadow: 0 6px 16px rgba(0,0,0,.35); --overlay: rgba(0,0,0,.6);
  --mint: #19B897; --lilac: #9C85FF; color-scheme: dark; } }
:root[data-theme="dark"] {
  --sky-top: #0D1736; --sky-bot: #16244C; --ink: #EEF3FF; --ink-soft: #A7B4D4; --card: #1C2A55;
  --card-line: #2B3C70; --lane: #23346A; --ground: rgba(0,0,0,.35); --coral: #FF6B5A; --coral-deep: #D94C3C;
  --disabled: #2C3B68; --on-disabled: #8391B8; --shadow: 0 6px 16px rgba(0,0,0,.35); --overlay: rgba(0,0,0,.6);
  --mint: #19B897; --lilac: #9C85FF; color-scheme: dark; }

html, body { height: 100%; overscroll-behavior: none; }
body {
  margin: 0; background: linear-gradient(var(--tint), var(--tint)), linear-gradient(180deg, var(--sky-top), var(--sky-bot) 45%);
  background-color: var(--sky-bot); color: var(--ink); font-family: var(--font-body); font-weight: 700;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--lilac); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; position: relative; }

/* HUD */
.hud { padding: 10px max(16px, env(safe-area-inset-left, 0px)) 8px max(16px, env(safe-area-inset-right, 0px)); position: relative; }
.hud-row { display: flex; align-items: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border-radius: 999px; padding: 5px 10px 5px 6px; box-shadow: var(--shadow); font-size: 14px; min-height: 32px; }
.chip svg { width: 22px; height: 22px; flex: none; }
.city { flex: 1; text-align: center; font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--ink-soft); letter-spacing: .02em; display: flex; align-items: center; justify-content: center; gap: 4px; min-width: 0; }
.city svg { width: 16px; height: 16px; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--card); display: grid; place-items: center; box-shadow: var(--shadow); flex: none; }
.icon-btn svg { width: 20px; height: 20px; }
.wallet { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
.wallet svg { width: 34px; height: 34px; }
.wallet .amount { font-family: var(--font-display); font-weight: 700; font-size: clamp(32px, 10vw, 42px); line-height: 1; letter-spacing: -.01em; }
.rate { text-align: center; color: var(--ink-soft); font-size: 14px; margin-top: 4px; display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; }
.boost { background: var(--sun); color: var(--on-sun); border-radius: 999px; padding: 2px 9px; font-size: 12px; }
.boost.gold { background: var(--coral); color: var(--on-coral); }

/* Main scroller */
main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px max(16px, env(safe-area-inset-left, 0px)) 18px max(16px, env(safe-area-inset-right, 0px)); }
.tab { display: flex; flex-direction: column; gap: 12px; }
.multi { display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
.multi span { margin-right: auto; color: var(--ink-soft); font-size: 13px; }
.multi button { padding: 6px 11px; border-radius: 999px; background: var(--card); font-size: 13px; box-shadow: var(--shadow); min-width: 46px; min-height: 32px; }
.multi button[aria-pressed="true"] { background: var(--ink); color: var(--card); }

/* Route card */
.route { background: var(--card); border-radius: 22px; padding: 12px; box-shadow: var(--shadow); display: grid; grid-template-columns: 72px 1fr; gap: 4px 12px; position: relative; }
.route .art { grid-row: span 2; width: 72px; height: 72px; position: relative; }
.route .art svg { width: 72px; height: 72px; display: block; }
.route .art.pop { animation: pop .38s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { 0% { transform: scale(1.25, .75); } 100% { transform: scale(1); } }
.route .head { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.route .name { font-family: var(--font-display); font-weight: 600; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.route .lvl { color: var(--ink-soft); font-size: 13px; white-space: nowrap; }
.route .gain { font-size: 12px; color: var(--ink); white-space: nowrap; }
.route .ms-t { white-space: nowrap; }
.lane { position: relative; height: 40px; border-radius: 14px; background: var(--lane); cursor: pointer; }
.lane::before { content: ""; position: absolute; left: 14px; right: 34px; top: 50%; border-top: 2px dashed var(--card-line); }
.lane .pigeon { position: absolute; top: 1px; left: 2px; width: 44px; height: 36px; transform: translateX(var(--x, 0px)); will-change: transform; }
.lane .dest { position: absolute; right: 6px; top: 8px; width: 24px; height: 24px; }
.lane .hint { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; color: var(--ink-soft); pointer-events: none; padding-left: 40px; }
.lane .hint b { color: var(--coral); }
.route .ms { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); }
.bar { flex: 1; height: 6px; border-radius: 3px; background: var(--lane); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; transform-origin: left; transform: scaleX(var(--f, 0)); background: var(--sun); border-radius: 3px; }
.route .actions { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 4px; }
.btn { border-radius: 16px; padding: 9px 12px; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; transition: transform .08s; }
.btn:active:not(:disabled) { transform: scale(.96); }
.btn small { font-size: 12px; opacity: .9; display: flex; align-items: center; gap: 4px; }
.btn small svg { width: 14px; height: 14px; }
.btn-buy { flex: 1.6; background: var(--coral); color: var(--on-coral); box-shadow: 0 4px 0 var(--coral-deep); font-size: 16px; }
.btn-mgr { flex: 1; background: var(--mint); color: var(--on-mint); box-shadow: 0 4px 0 color-mix(in srgb, var(--mint) 70%, black); font-size: 14px; }
.btn-sun { background: var(--sun); color: var(--on-sun); box-shadow: 0 4px 0 var(--sun-deep); }
.btn-ghost { background: var(--lane); color: var(--ink); }
.btn:disabled { background: var(--disabled); color: var(--on-disabled); box-shadow: none; cursor: default; }
.badge { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: var(--mint); border: 2px dashed color-mix(in srgb, var(--mint) 45%, transparent); border-radius: 16px; }
.badge svg { width: 18px; height: 18px; }
.route.locked .art svg, .route.locked .lane { filter: grayscale(1); opacity: .55; }
.route.locked .lane { cursor: default; }
.coin-pop { position: absolute; right: 30px; top: 0; font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--sun-deep); pointer-events: none; animation: rise .8s ease-out forwards; white-space: nowrap; }
@keyframes rise { from { transform: translateY(6px); opacity: 1; } to { transform: translateY(-18px); opacity: 0; } }

.pigeon .wing { transform-box: view-box; transform-origin: 33px 24px; }
.pigeon.flying .wing { animation: flap .22s ease-in-out infinite alternate; }
@keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(-.55); } }
.pigeon.flying .body-g { animation: bob .44s ease-in-out infinite alternate; }
@keyframes bob { from { transform: translateY(-1px); } to { transform: translateY(1.5px); } }

/* Generic panels */
.panel { background: var(--card); border-radius: 22px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 19px; text-wrap: balance; }
.panel p { margin: 0; color: var(--ink-soft); font-size: 14px; line-height: 1.4; }
.row { display: flex; align-items: center; gap: 10px; }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-size: 15px; }
.row .sub { font-size: 13px; color: var(--ink-soft); }
.row .btn { min-width: 104px; min-height: 44px; font-size: 14px; }
.list { display: flex; flex-direction: column; gap: 12px; }
.list > .row + .row { border-top: 1px solid var(--card-line); padding-top: 12px; }
.ico { width: 40px; height: 40px; border-radius: 12px; background: var(--lane); display: grid; place-items: center; flex: none; }
.ico svg { width: 26px; height: 26px; }
.done { color: var(--mint); font-size: 13px; display: flex; align-items: center; gap: 4px; }
.streak { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.streak div { border-radius: 12px; background: var(--lane); text-align: center; padding: 6px 2px; font-size: 12px; color: var(--ink-soft); }
.streak div b { display: block; font-size: 14px; color: var(--ink); }
.streak div.got { background: color-mix(in srgb, var(--mint) 22%, var(--card)); }
.streak div.today { outline: 2px solid var(--sun); }
.big-stat { font-family: var(--font-display); font-weight: 700; font-size: 28px; }
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.skin { border-radius: 18px; background: var(--lane); padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.skin svg.pigeon { width: 76px; height: 62px; }
.skin.on { outline: 3px solid var(--mint); }
.skin .btn { width: 100%; min-height: 40px; font-size: 13px; }
.note { font-size: 12px; color: var(--ink-soft); }

/* Tab bar */
.tabbar { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--card); box-shadow: 0 -4px 16px rgba(20,33,61,.08); padding: 6px max(8px, env(safe-area-inset-left, 0px)) 6px max(8px, env(safe-area-inset-right, 0px)); border-radius: 22px 22px 0 0; }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 4px; font-size: 12px; color: var(--ink-soft); position: relative; min-height: 52px; }
.tabbar button svg { width: 26px; height: 26px; }
.tabbar button[aria-selected="true"] { color: var(--coral); }
.dot { position: absolute; top: 4px; right: calc(50% - 20px); width: 10px; height: 10px; border-radius: 50%; background: var(--coral); border: 2px solid var(--card); }

/* Golden pigeon */
#golden { position: absolute; top: 120px; left: 0; width: 84px; height: 70px; z-index: 30; animation: cross var(--dur, 9s) linear forwards; filter: drop-shadow(0 0 10px rgba(255,194,61,.9)); padding: 6px; }
#golden svg { width: 72px; height: 58px; --pg-body: #FFD45C; --pg-wing: #F2A900; --pg-neck: #FFE9A8; }
@keyframes cross { from { transform: translateX(-90px) translateY(0); } 25% { transform: translateX(22vw) translateY(-14px); } 50% { transform: translateX(45vw) translateY(10px); } 75% { transform: translateX(68vw) translateY(-12px); } to { transform: translateX(calc(min(100vw, 560px) + 10px)) translateY(0); } }

/* Toasts, modal, coach */
#toasts { position: absolute; left: 0; right: 0; bottom: 92px; display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 40; pointer-events: none; padding: 0 16px; }
.toast { background: var(--ink); color: var(--card); padding: 9px 16px; border-radius: 999px; font-size: 14px; box-shadow: var(--shadow); animation: toast 2.6s ease forwards; text-align: center; max-width: 100%; }
@keyframes toast { 0% { transform: translateY(10px); opacity: 0; } 8%, 85% { transform: none; opacity: 1; } 100% { opacity: 0; } }
#modal { position: fixed; inset: 0; background: var(--overlay); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--card); width: 100%; max-width: 560px; border-radius: 26px 26px 0 0; padding: 20px max(18px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; animation: up .25s ease-out; max-height: 88%; overflow-y: auto; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 22px; text-wrap: balance; }
.sheet p { margin: 0; color: var(--ink-soft); line-height: 1.45; font-size: 15px; }
.sheet .btns { display: flex; gap: 10px; }
.sheet .btns .btn { flex: 1; font-size: 16px; }
.ad-box { border-radius: 18px; background: var(--lane); height: 150px; display: grid; place-items: center; text-align: center; color: var(--ink-soft); font-size: 14px; padding: 12px; }
#coach { position: absolute; inset: 0; z-index: 35; pointer-events: none; }
#coach .hand { position: absolute; width: 44px; height: 44px; animation: tap 1s ease-in-out infinite; }
@keyframes tap { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(4px, 6px) scale(.9); } }
#coach .bubble { position: absolute; left: 16px; right: 16px; background: var(--ink); color: var(--card); border-radius: 18px; padding: 12px 14px; font-size: 15px; line-height: 1.35; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: flex-start; }
#coach .bubble span { flex: 1; }
#coach .bubble button { pointer-events: auto; font-size: 12px; opacity: .75; padding: 4px; text-decoration: underline; }
.clouds { position: absolute; inset: 0 0 auto; height: 150px; overflow: hidden; pointer-events: none; z-index: -1; }
.clouds i { position: absolute; display: block; width: 90px; height: 28px; border-radius: 20px; background: rgba(255,255,255,.55); animation: drift 60s linear infinite; }
.clouds i::before { content: ""; position: absolute; width: 44px; height: 34px; border-radius: 50%; background: inherit; left: 18px; top: -16px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .clouds i { background: rgba(255,255,255,.06); } }
:root[data-theme="dark"] .clouds i { background: rgba(255,255,255,.06); }
@keyframes drift { from { transform: translateX(-120px); } to { transform: translateX(620px); } }
@media (prefers-reduced-motion: reduce) {
  .clouds i, .pigeon.flying .wing, .pigeon.flying .body-g, #coach .hand { animation: none; }
  .route .art.pop, .coin-pop, .sheet { animation: none; }
}
</style>

<div id="app" data-skin="classique">
  <header class="hud">
    <div class="clouds" aria-hidden="true"><i style="top:18px;animation-delay:-12s"></i><i style="top:70px;animation-delay:-40s;transform:scale(.7)"></i><i style="top:46px;animation-delay:-27s"></i></div>
    <div class="hud-row">
      <button class="chip" id="levelChip" aria-label="Niveau du joueur">
        <svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--lane)" stroke-width="5"/><circle id="xpRing" cx="18" cy="18" r="15" fill="none" stroke="var(--lilac)" stroke-width="5" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="94.2" transform="rotate(-90 18 18)"/></svg>
        <span>Niv <b id="level" class="num">1</b></span>
      </button>
      <div class="city"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V11l5-4 5 4v10M13 21V6l4-3 4 3v15M3 21h18" fill="none" stroke="var(--ink-soft)" stroke-width="2" stroke-linejoin="round"/></svg><span id="cityName">Village</span></div>
      <button class="chip" id="gemChip" aria-label="Gemmes, ouvrir la boutique"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-gem"/></svg><b id="gems" class="num">0</b></button>
      <button class="icon-btn" id="settingsBtn" aria-label="Réglages"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.3" fill="var(--ink-soft)"/><circle cx="12" cy="12" r="7.4" fill="none" stroke="var(--ink-soft)" stroke-width="3.2" stroke-dasharray="3.1 2.7"/></svg></button>
    </div>
    <div class="wallet"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-coin"/></svg><span class="amount num" id="coins">0</span></div>
    <div class="rate"><span><span id="rate" class="num">0</span> / s</span><span id="boostAd" class="boost num" hidden></span><span id="boostGold" class="boost gold num" hidden></span></div>

  <main id="main">

      </div>

    </section>
    <section class="tab" id="tab-upgrades" role="tabpanel" aria-label="Améliorations" hidden></section>
    <section class="tab" id="tab-empire" role="tabpanel" aria-label="Empire" hidden></section>
    <section class="tab" id="tab-shop" role="tabpanel" aria-label="Boutique" hidden></section>
  </main>

  <nav class="tabbar" role="tablist">
    <button role="tab" data-tab="routes" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18c4-12 10 2 14-11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-dasharray="3.5 3" stroke-linecap="round"/><circle cx="5" cy="18" r="2.6" fill="currentColor"/><circle cx="19" cy="6" r="2.6" fill="currentColor"/></svg>Routes</button>

    <button role="tab" data-tab="empire" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M5 19l-1-11 5 4 3-7 3 7 5-4-1 11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg>Empire<i class="dot" id="dot-empire" hidden></i></button>
    <button role="tab" data-tab="shop" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M9 8a3 3 0 0 1 6 0" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>Boutique</button>
  </nav>

  <div id="toasts" aria-live="polite"></div>
  <div id="coach" hidden></div>
</div>
<div id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#FFC23D"/><circle cx="12" cy="12" r="7.2" fill="none" stroke="#E09A00" stroke-width="1.6"/><path d="M9.6 16.5V7.8h3.1a2.5 2.5 0 0 1 0 5H9.6" fill="none" stroke="#B27600" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
